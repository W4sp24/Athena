[project]
name = "cryptolab"
version = "0.1.0"
description = "Crypto quant research, backtesting, and paper-trading platform (safe by default)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "ccxt>=4.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
news = ["openai>=1.30"]          # OpenAI-compatible client for the local LLM server
stats = ["scipy>=1.13", "statsmodels>=0.14"]
dashboard = ["streamlit>=1.36"]

[project.scripts]
cryptolab = "cryptolab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cryptolab"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["prototypes", "ui-reference", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cryptolab"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "duckdb", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "testnet: hits a real exchange testnet; needs CRYPTOLAB_TESTNET_* env vars (skipped otherwise)",
]

[tool.coverage.run]
source = ["cryptolab"]
branch = true

# ---------------------------------------------------- module boundaries
[tool.importlinter]
root_package = "cryptolab"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Strategies cannot reach orders, risk, config, or the exchange"
type = "forbidden"
source_modules = ["cryptolab.strategies"]
forbidden_modules = [
    "cryptolab.execution",
    "cryptolab.risk",
    "cryptolab.config",
    "cryptolab.reconcile",
    "ccxt",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Data and news layers do not depend on trading layers"
type = "forbidden"
source_modules = ["cryptolab.data", "cryptolab.news"]
forbidden_modules = [
    "cryptolab.engine",
    "cryptolab.strategies",
    "cryptolab.execution",
    "cryptolab.risk",
    "cryptolab.reconcile",
]

[[tool.importlinter.contracts]]
name = "Config is a leaf"
type = "forbidden"
source_modules = ["cryptolab.config"]
forbidden_modules = [
    "cryptolab.data",
    "cryptolab.news",
    "cryptolab.strategies",
    "cryptolab.engine",
    "cryptolab.risk",
    "cryptolab.execution",
    "cryptolab.reconcile",
    "cryptolab.analytics",
    "cryptolab.dashboard",
]

[[tool.importlinter.contracts]]
name = "Nothing depends on the presentation layer"
type = "forbidden"
source_modules = [
    "cryptolab.data",
    "cryptolab.news",
    "cryptolab.strategies",
    "cryptolab.engine",
    "cryptolab.risk",
    "cryptolab.execution",
    "cryptolab.reconcile",
    "cryptolab.analytics",
]
forbidden_modules = ["cryptolab.dashboard", "cryptolab.cli"]
